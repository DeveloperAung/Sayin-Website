<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=/privacy-policy/">
  <meta name="robots" content="noindex, follow">
  <title>Redirecting to Privacy Policy – Sayin</title>
  <script>
    (function () {
      // Preserve any #hash and search params during redirect
      var target = '/privacy-policy/' + window.location.search + window.location.hash;
      window.location.replace(target);
    })();
  </script>
  <link rel="canonical" href="https://sayin.baganbyte.com/privacy-policy/">
  <style>
    body {
      background-color: #061D18;
      color: #F2EBDD;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1.5rem;
    }
    a {
      color: #D4B26A;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div>
    <p>Redirecting to Privacy Policy...</p>
    <p style="margin-top: 1rem; font-size: 0.9rem; opacity: 0.8;">
      <a href="/privacy-policy/">Click here if you are not redirected automatically.</a>
    </p>
  </div>
</body>
</html>
