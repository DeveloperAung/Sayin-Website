<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#071E19; font-family:'Noto Sans Myanmar', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#183B33"/>
      <stop offset="100%" stop-color="#112D27"/>
    </linearGradient>
  </defs>

  <!-- Status Bar -->
  <text x="36" y="38" fill="#F2EBDD" font-size="15" font-weight="600">9:24</text>
  <rect x="130" y="14" width="130" height="32" rx="16" fill="#000"/>
  <g transform="translate(325, 26)" fill="#F2EBDD">
    <path d="M 0 10 L 3 10 L 3 14 L 0 14 Z M 5 7 L 8 7 L 8 14 L 5 14 Z M 10 4 L 13 4 L 13 14 L 10 14 Z M 15 1 L 18 1 L 18 14 L 15 14 Z"/>
    <rect x="24" y="2" width="22" height="12" rx="3" fill="none" stroke="#F2EBDD" stroke-width="1.5"/>
    <rect x="26" y="4" width="16" height="8" rx="1.5" fill="#34D399"/>
  </g>

  <!-- Page Title -->
  <text x="195" y="105" text-anchor="middle" fill="#F2EBDD" font-size="20" font-weight="600">ငွေအဝင်အထွက် အသစ်</text>

  <!-- Amount Display -->
  <g transform="translate(20, 140)">
    <text x="10" y="30" fill="#F2EBDD" font-size="20" font-weight="700">SGD</text>
    <text x="340" y="32" text-anchor="end" fill="#6EE7B7" font-size="34" font-weight="400">0</text>
  </g>

  <!-- Segmented Control: Expense, Income, Transfer -->
  <g transform="translate(20, 185)">
    <rect width="350" height="42" rx="21" fill="#0D2822" stroke="rgba(212,178,106,0.18)" stroke-width="1"/>
    <!-- Active: အသုံးစရိတ် -->
    <rect x="2" y="2" width="118" height="38" rx="19" fill="#1B4D40"/>
    <text x="61" y="26" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">အသုံးစရိတ်</text>
    <text x="175" y="26" text-anchor="middle" fill="#A3B8B0" font-size="14">ဝင်ငွေ</text>
    <text x="290" y="26" text-anchor="middle" fill="#A3B8B0" font-size="14">ငွေလွှဲ</text>
  </g>

  <!-- Description Input Field -->
  <g transform="translate(20, 245)">
    <text x="4" y="0" fill="#A3B8B0" font-size="13">အကြောင်းအရာ</text>
    <rect x="0" y="10" width="350" height="46" rx="14" fill="#0E2D25" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </g>

  <!-- Category Grid (Icons) -->
  <g transform="translate(20, 320)">
    <!-- 1. အစားအသောက် -->
    <circle cx="38" cy="24" r="18" fill="#422222"/>
    <text x="38" y="29" text-anchor="middle" font-size="16">🍴</text>
    <text x="38" y="54" text-anchor="middle" fill="#C2D6CF" font-size="11">အစားအသောက်</text>

    <!-- 2. ဖျော်ဖြေရေး -->
    <circle cx="128" cy="24" r="18" fill="#401F33"/>
    <text x="128" y="29" text-anchor="middle" font-size="16">🎟️</text>
    <text x="128" y="54" text-anchor="middle" fill="#C2D6CF" font-size="11">ဖျော်ဖြေရေး</text>

    <!-- 3. ဈေးဖိုး -->
    <circle cx="218" cy="24" r="18" fill="#173D30"/>
    <text x="218" y="29" text-anchor="middle" font-size="16">🛒</text>
    <text x="218" y="54" text-anchor="middle" fill="#C2D6CF" font-size="11">ဈေးဖိုး</text>

    <!-- 4. အိမ်လခ -->
    <circle cx="308" cy="24" r="18" fill="#3D321F"/>
    <text x="308" y="29" text-anchor="middle" font-size="16">🏠</text>
    <text x="308" y="54" text-anchor="middle" fill="#C2D6CF" font-size="11">အိမ်လခ</text>

    <!-- Row 2 -->
    <!-- 5. ဘေလ်များ -->
    <circle cx="38" cy="86" r="18" fill="#3E3618"/>
    <text x="38" y="91" text-anchor="middle" font-size="16">🧾</text>
    <text x="38" y="116" text-anchor="middle" fill="#C2D6CF" font-size="11">ဘေလ်များ</text>

    <!-- 6. အိမ်ပို့ငွေ (Remittances!) -->
    <circle cx="128" cy="86" r="18" fill="#13473E"/>
    <text x="128" y="91" text-anchor="middle" font-size="16">🔄</text>
    <text x="128" y="116" text-anchor="middle" fill="#34D399" font-size="11" font-weight="600">အိမ်ပို့ငွေ</text>

    <!-- 7. သွားလာရေး -->
    <circle cx="218" cy="86" r="18" fill="#1A3344"/>
    <text x="218" y="91" text-anchor="middle" font-size="16">🚌</text>
    <text x="218" y="116" text-anchor="middle" fill="#C2D6CF" font-size="11">သွားလာရေး</text>

    <!-- 8. နောက်ထပ် -->
    <circle cx="308" cy="86" r="18" fill="#123E33"/>
    <text x="308" y="91" text-anchor="middle" font-size="16">•••</text>
    <text x="308" y="116" text-anchor="middle" fill="#C2D6CF" font-size="11">နောက်ထပ် ›</text>
  </g>

  <!-- Number Keypad -->
  <g transform="translate(20, 465)">
    <!-- Row 1: 1, 2, 3 -->
    <rect x="0" y="0" width="110" height="48" rx="14" fill="url(#keyGrad)"/>
    <text x="55" y="32" text-anchor="middle" fill="#F2EBDD" font-size="22" font-weight="600">1</text>
    <rect x="120" y="0" width="110" height="48" rx="14" fill="url(#keyGrad)"/>
    <text x="175" y="32" text-anchor="middle" fill="#F2EBDD" font-size="22" font-weight="600">2</text>
    <rect x="240" y="0" width="110" height="48" rx="14" fill="url(#keyGrad)"/>
    <text x="295" y="32" text-anchor="middle" fill="#F2EBDD" font-size="22" font-weight="600">3</text>

    <!-- Row 2: 4, 5, 6 -->
    <rect x="0" y="56" width="110" height="48" rx="14" fill="url(#keyGrad)"/>
    <text x="55" y="88" text-anchor="middle" fill="#F2EBDD" font-size="22" font-weight="600">4</text>
    <rect x="120" y="56" width="110" height="48" rx="14" fill="url(#keyGrad)"/>
    <text x="175" y="88" text-anchor="middle" fill="#F2EBDD" font-size="22" font-weight="600">5</text>
    <rect x="240" y="56" width="110" height="48" rx="14" fill="url(#keyGrad)"/>
    <text x="295" y="88" text-anchor="middle" fill="#F2EBDD" font-size="22" font-weight="600">6</text>

    <!-- Row 3: 7, 8, 9 -->
    <rect x="0" y="112" width="110" height="48" rx="14" fill="url(#keyGrad)"/>
    <text x="55" y="144" text-anchor="middle" fill="#F2EBDD" font-size="22" font-weight="600">7</text>
    <rect x="120" y="112" width="110" height="48" rx="14" fill="url(#keyGrad)"/>
    <text x="175" y="144" text-anchor="middle" fill="#F2EBDD" font-size="22" font-weight="600">8</text>
    <rect x="240" y="112" width="110" height="48" rx="14" fill="url(#keyGrad)"/>
    <text x="295" y="144" text-anchor="middle" fill="#F2EBDD" font-size="22" font-weight="600">9</text>

    <!-- Row 4: ., 0, backspace -->
    <rect x="0" y="168" width="110" height="48" rx="14" fill="url(#keyGrad)"/>
    <text x="55" y="200" text-anchor="middle" fill="#F2EBDD" font-size="24" font-weight="600">.</text>
    <rect x="120" y="168" width="110" height="48" rx="14" fill="url(#keyGrad)"/>
    <text x="175" y="200" text-anchor="middle" fill="#F2EBDD" font-size="22" font-weight="600">0</text>
    <rect x="240" y="168" width="110" height="48" rx="14" fill="url(#keyGrad)"/>
    <path d="M 288 192 L 294 186 L 306 186 L 306 198 L 294 198 Z M 297 189 L 303 195 M 303 189 L 297 195" stroke="#F2EBDD" stroke-width="2" fill="none"/>

    <!-- Save Button -->
    <rect x="0" y="226" width="350" height="46" rx="23" fill="#123C32" stroke="rgba(212,178,106,0.18)" stroke-width="1"/>
    <text x="175" y="255" text-anchor="middle" fill="#A3B8B0" font-size="15" font-weight="600">သိမ်းဆည်းရန်</text>
  </g>

  <!-- Home Indicator -->
  <rect x="128" y="830" width="134" height="4.5" rx="2.25" fill="#FFFFFF" opacity="0.3"/>
</svg>
