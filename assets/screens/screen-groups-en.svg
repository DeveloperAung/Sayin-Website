<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#071E19; font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="grpCardGradEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E332B"/>
      <stop offset="100%" stop-color="#08221D"/>
    </linearGradient>
  </defs>

  <!-- Status Bar -->
  <text x="36" y="38" fill="#F2EBDD" font-size="15" font-weight="600">9:23</text>
  <rect x="130" y="14" width="130" height="32" rx="16" fill="#000"/>
  <g transform="translate(325, 26)" fill="#F2EBDD">
    <path d="M 0 10 L 3 10 L 3 14 L 0 14 Z M 5 7 L 8 7 L 8 14 L 5 14 Z M 10 4 L 13 4 L 13 14 L 10 14 Z M 15 1 L 18 1 L 18 14 L 15 14 Z"/>
    <rect x="24" y="2" width="22" height="12" rx="3" fill="none" stroke="#F2EBDD" stroke-width="1.5"/>
    <rect x="26" y="4" width="16" height="8" rx="1.5" fill="#34D399"/>
  </g>

  <!-- Title -->
  <text x="20" y="105" fill="#F2EBDD" font-size="28" font-weight="700">Groups</text>
  <rect x="116" y="86" width="60" height="24" rx="12" fill="#133D33"/>
  <text x="126" y="103" fill="#A7F3D0" font-size="12" font-weight="600">1 group</text>

  <!-- Search Bar -->
  <g transform="translate(20, 135)">
    <rect width="350" height="46" rx="23" fill="#0D2C24" stroke="rgba(212,178,106,0.15)" stroke-width="1"/>
    <circle cx="28" cy="23" r="7" fill="none" stroke="#758D84" stroke-width="2"/>
    <line x1="33" y1="28" x2="40" y2="35" stroke="#758D84" stroke-width="2" stroke-linecap="round"/>
    <text x="50" y="29" fill="#758D84" font-size="14">Search groups or members</text>
  </g>

  <!-- Filter Pills -->
  <g transform="translate(20, 200)">
    <!-- Active Pill: All -->
    <rect x="0" y="0" width="64" height="34" rx="17" fill="#13473B" stroke="#34D399" stroke-width="1"/>
    <path d="M 14 17 L 18 21 L 26 13" stroke="#34D399" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="32" y="22" fill="#E2F1EC" font-size="13">All</text>

    <!-- Payable -->
    <rect x="74" y="0" width="76" height="34" rx="17" fill="#0D2C24"/>
    <text x="88" y="22" fill="#A3B8B0" font-size="13">Payable</text>

    <!-- Receivable -->
    <rect x="158" y="0" width="94" height="34" rx="17" fill="#0D2C24"/>
    <text x="172" y="22" fill="#A3B8B0" font-size="13">Receivable</text>

    <!-- Settled up -->
    <rect x="260" y="0" width="94" height="34" rx="17" fill="#0D2C24"/>
    <text x="274" y="22" fill="#A3B8B0" font-size="13">Settled up</text>
  </g>

  <!-- Group Card: MalayTrip -->
  <g transform="translate(20, 260)">
    <rect width="350" height="74" rx="18" fill="url(#grpCardGradEn)" stroke="rgba(212,178,106,0.18)" stroke-width="1"/>
    <!-- Group Icon (Flight) -->
    <rect x="14" y="14" width="46" height="46" rx="14" fill="#153B32"/>
    <path d="M 28 42 L 34 36 L 46 39 L 48 37 L 39 30 L 41 24 L 38 23 L 34 28 L 26 26 L 24 28 L 29 32 L 27 34 L 24 33 L 23 35 Z" fill="#6EE7B7"/>
    <text x="72" y="38" fill="#F2EBDD" font-size="16" font-weight="600">MalayTrip</text>
    <!-- Settled status badge -->
    <g transform="translate(72, 48)">
      <circle cx="6" cy="6" r="6" fill="#134438"/>
      <path d="M 3 6 L 5 8 L 9 4" stroke="#34D399" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <text x="16" y="10" fill="#34D399" font-size="12">Settled up</text>
    </g>
    <!-- Chevron -->
    <path d="M 324 33 L 330 38 L 324 43" stroke="#758D84" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Floating Action Button: + New group -->
  <g transform="translate(210, 670)">
    <rect width="160" height="52" rx="26" fill="#086E58" stroke="rgba(212,178,106,0.25)" stroke-width="1"/>
    <path d="M 24 26 L 38 26 M 31 19 L 31 33" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="46" y="32" fill="#FFFFFF" font-size="14" font-weight="600">New group</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 755)">
    <rect width="390" height="89" fill="#07201A" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Tab 1: Home -->
    <path d="M 30.5 19.5 L 39 12.5 L 47.5 19.5 L 47.5 27 C 47.5 27.8 46.8 28.5 46 28.5 L 32 28.5 C 31.2 28.5 30.5 27.8 30.5 27 Z" fill="none" stroke="#758D84" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 36.5 28.5 L 36.5 23.5 C 36.5 23 37 22.5 37.5 22.5 L 40.5 22.5 C 41 22.5 41.5 23 41.5 23.5 L 41.5 28.5" fill="none" stroke="#758D84" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="39" y="48" text-anchor="middle" fill="#758D84" font-size="10.5">Home</text>

    <!-- Tab 2: Groups (Active) -->
    <rect x="93" y="6" width="48" height="26" rx="13" fill="#13473B"/>
    <g fill="#34D399">
      <circle cx="113" cy="14.5" r="3.4"/>
      <path d="M 105.5 27.5 C 105.5 23.5 108.8 21.2 113 21.2 C 117.2 21.2 120.5 23.5 120.5 27.5 Z"/>
      <circle cx="122" cy="13.5" r="2.7"/>
      <path d="M 120.8 22.5 C 122.8 22.8 125.2 24.2 125.2 27.5 L 121 27.5 C 121 25.5 120.5 23.8 120 22.5 Z"/>
    </g>
    <text x="117" y="48" text-anchor="middle" fill="#34D399" font-size="10.5" font-weight="600">Groups</text>

    <!-- Tab 3: Add (+) -->
    <circle cx="195" cy="18" r="18" fill="#0B7963"/>
    <path d="M 195 11 L 195 25 M 188 18 L 202 18" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
    <text x="195" y="48" text-anchor="middle" fill="#758D84" font-size="10.5">Add</text>

    <!-- Tab 4: Activity -->
    <g stroke="#758D84" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="266" y="10.5" width="14" height="17" rx="2.5"/>
      <path d="M 269.5 15 L 276.5 15 M 269.5 19 L 276.5 19 M 269.5 23 L 273.5 23"/>
    </g>
    <text x="273" y="48" text-anchor="middle" fill="#758D84" font-size="10.5">Activity</text>

    <!-- Tab 5: Account -->
    <g fill="none" stroke="#758D84" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="351" cy="14.5" r="3.3"/>
      <path d="M 343.5 27.5 C 343.5 23.5 346.8 21.2 351 21.2 C 355.2 21.2 358.5 23.5 358.5 27.5"/>
    </g>
    <text x="351" y="48" text-anchor="middle" fill="#758D84" font-size="10.5">Account</text>

    <!-- Home Indicator -->
    <rect x="128" y="76" width="134" height="4.5" rx="2.25" fill="#FFFFFF" opacity="0.3"/>
  </g>
</svg>
