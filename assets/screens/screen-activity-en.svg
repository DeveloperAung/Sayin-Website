<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#071E19; font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="actCardGradEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E332B"/>
      <stop offset="100%" stop-color="#08221D"/>
    </linearGradient>
  </defs>

  <!-- Status Bar -->
  <text x="36" y="38" fill="#F2EBDD" font-size="15" font-weight="600">9:24</text>
  <rect x="130" y="14" width="130" height="32" rx="16" fill="#000"/>
  <g transform="translate(325, 26)" fill="#F2EBDD">
    <path d="M 0 10 L 3 10 L 3 14 L 0 14 Z M 5 7 L 8 7 L 8 14 L 5 14 Z M 10 4 L 13 4 L 13 14 L 10 14 Z M 15 1 L 18 1 L 18 14 L 15 14 Z"/>
    <rect x="24" y="2" width="22" height="12" rx="3" fill="none" stroke="#F2EBDD" stroke-width="1.5"/>
    <rect x="26" y="4" width="16" height="8" rx="1.5" fill="#34D399"/>
  </g>

  <!-- Title -->
  <text x="20" y="105" fill="#F2EBDD" font-size="28" font-weight="700">Activity</text>
  <rect x="120" y="86" width="70" height="24" rx="12" fill="#133D33"/>
  <text x="130" y="103" fill="#A7F3D0" font-size="12" font-weight="600">1 update</text>

  <!-- Action icons -->
  <g transform="translate(315, 88)" stroke="#758D84" stroke-width="2" fill="none">
    <!-- Filter icon -->
    <path d="M 0 4 L 16 4 M 4 10 L 12 10 M 7 16 L 9 16" stroke-linecap="round"/>
    <!-- Search icon -->
    <circle cx="36" cy="7" r="5"/>
    <line x1="40" y1="11" x2="45" y2="16" stroke-linecap="round"/>
  </g>

  <!-- Filter Pills -->
  <g transform="translate(20, 140)">
    <rect x="0" y="0" width="94" height="34" rx="17" fill="#0D2C24"/>
    <text x="18" y="22" fill="#A3B8B0" font-size="13">Payments</text>

    <rect x="104" y="0" width="64" height="34" rx="17" fill="#0D2C24"/>
    <text x="120" y="22" fill="#A3B8B0" font-size="13">Edits</text>

    <rect x="178" y="0" width="172" height="34" rx="17" fill="#13473B" stroke="#34D399" stroke-width="1"/>
    <path d="M 190 17 L 194 21 L 202 13" stroke="#34D399" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="208" y="22" fill="#E2F1EC" font-size="13">Members &amp; group 1</text>
  </g>

  <!-- Date header -->
  <text x="20" y="215" fill="#A3B8B0" font-size="14" font-weight="600">9 October 2026</text>

  <!-- Activity Item Card -->
  <g transform="translate(20, 230)">
    <rect width="350" height="82" rx="18" fill="url(#actCardGradEn)" stroke="rgba(212,178,106,0.14)" stroke-width="1"/>
    <rect x="14" y="16" width="46" height="46" rx="14" fill="#153B32"/>
    <!-- User icon -->
    <circle cx="37" cy="34" r="6" fill="#6EE7B7"/>
    <path d="M 30 46 C 30 42 33 41 37 41 C 41 41 44 42 44 46 Z" fill="#6EE7B7"/>
    <path d="M 46 32 L 50 32 M 48 30 L 48 34" stroke="#6EE7B7" stroke-width="1.5" stroke-linecap="round"/>
    
    <text x="70" y="38" fill="#F2EBDD" font-size="14" font-weight="600">You created the group MalayTrip</text>
    
    <!-- Group pill -->
    <rect x="70" y="48" width="82" height="20" rx="10" fill="#153830"/>
    <circle cx="80" cy="58" r="3" fill="#6EE7B7"/>
    <text x="88" y="62" fill="#A7F3D0" font-size="11">MalayTrip</text>

    <text x="162" y="62" fill="#758D84" font-size="12">17:02</text>
  </g>

  <!-- Bottom Sheet Modal: By group -->
  <g transform="translate(0, 520)">
    <rect width="390" height="240" rx="32" fill="#0C2520" stroke="rgba(212,178,106,0.2)" stroke-width="1"/>
    <!-- Grab handle -->
    <rect x="175" y="12" width="40" height="4" rx="2" fill="#3D5A52"/>

    <text x="24" y="52" fill="#F2EBDD" font-size="18" font-weight="700">By group</text>

    <!-- Option 1: All (Selected) -->
    <g transform="translate(24, 76)">
      <circle cx="12" cy="12" r="10" fill="none" stroke="#34D399" stroke-width="2"/>
      <circle cx="12" cy="12" r="5" fill="#34D399"/>
      <text x="44" y="17" fill="#F2EBDD" font-size="16">All</text>
    </g>

    <!-- Option 2: Personal -->
    <g transform="translate(24, 126)">
      <circle cx="12" cy="12" r="10" fill="none" stroke="#758D84" stroke-width="2"/>
      <text x="44" y="17" fill="#F2EBDD" font-size="16">Personal</text>
    </g>

    <!-- Option 3: MalayTrip -->
    <g transform="translate(24, 176)">
      <circle cx="12" cy="12" r="10" fill="none" stroke="#758D84" stroke-width="2"/>
      <text x="44" y="17" fill="#F2EBDD" font-size="16">MalayTrip</text>
    </g>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 755)">
    <rect width="390" height="89" fill="#07201A" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Tab 1: Home -->
    <path d="M 30.5 19.5 L 39 12.5 L 47.5 19.5 L 47.5 27 C 47.5 27.8 46.8 28.5 46 28.5 L 32 28.5 C 31.2 28.5 30.5 27.8 30.5 27 Z" fill="none" stroke="#758D84" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 36.5 28.5 L 36.5 23.5 C 36.5 23 37 22.5 37.5 22.5 L 40.5 22.5 C 41 22.5 41.5 23 41.5 23.5 L 41.5 28.5" fill="none" stroke="#758D84" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="39" y="48" text-anchor="middle" fill="#758D84" font-size="10.5">Home</text>

    <!-- Tab 2: Groups -->
    <g fill="none" stroke="#758D84" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="113" cy="14.5" r="3.2"/>
      <path d="M 105.5 27.5 C 105.5 23.8 108.8 21.5 113 21.5 C 117.2 21.5 120.5 23.8 120.5 27.5"/>
      <path d="M 119.5 12 A 2.6 2.6 0 1 1 123.5 16"/>
      <path d="M 121.2 22.5 C 123.2 23.2 125 24.8 125 27.5"/>
    </g>
    <text x="117" y="48" text-anchor="middle" fill="#758D84" font-size="10.5">Groups</text>

    <!-- Tab 3: Add (+) -->
    <circle cx="195" cy="18" r="18" fill="#0B7963"/>
    <path d="M 195 11 L 195 25 M 188 18 L 202 18" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
    <text x="195" y="48" text-anchor="middle" fill="#758D84" font-size="10.5">Add</text>

    <!-- Tab 4: Activity (Active) -->
    <rect x="249" y="6" width="48" height="26" rx="13" fill="#13473B"/>
    <g stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="266" y="10.5" width="14" height="17" rx="2.5" fill="#15473C"/>
      <path d="M 269.5 15 L 276.5 15 M 269.5 19 L 276.5 19 M 269.5 23 L 273.5 23"/>
    </g>
    <text x="273" y="48" text-anchor="middle" fill="#34D399" font-size="10.5" font-weight="600">Activity</text>

    <!-- Tab 5: Account -->
    <g fill="none" stroke="#758D84" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="351" cy="14.5" r="3.3"/>
      <path d="M 343.5 27.5 C 343.5 23.5 346.8 21.2 351 21.2 C 355.2 21.2 358.5 23.5 358.5 27.5"/>
    </g>
    <text x="351" y="48" text-anchor="middle" fill="#758D84" font-size="10.5">Account</text>

    <!-- Home Indicator -->
    <rect x="128" y="76" width="134" height="4.5" rx="2.25" fill="#FFFFFF" opacity="0.3"/>
  </g>
</svg>
